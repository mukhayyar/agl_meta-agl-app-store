# Bind every flutter app instance to the compositor lifecycle. A flutter-auto
# client cannot outlive the compositor it was bound to; PartOf= makes an explicit
# `systemctl restart agl-compositor` tear the app down with it, and After= keeps
# the start ordering correct. (Crash/socket-activated recovery of the home screen
# is handled compositor-side in 10-recovery.conf, since PartOf= does not
# propagate to auto-restart or socket-activated starts.)
[Unit]
After=agl-compositor.service
PartOf=agl-compositor.service
