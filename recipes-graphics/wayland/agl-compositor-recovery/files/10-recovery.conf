# Deterministic self-heal after an agl-compositor crash (SIGSEGV) or watchdog
# timeout. Without this, a compositor crash leaves every UI client bound to the
# dead instance and the agl-shell background role unset -> a permanent black
# screen until reboot, which is unacceptable for an appliance.
[Unit]
# Never give up restarting the compositor: an appliance must always try to get
# back to a usable screen rather than latch into a failed state.
StartLimitIntervalSec=0

[Service]
# Upstream ships no Restart= (recovery relied on socket re-activation). Make a
# crash or watchdog kill deterministically respawn the compositor.
Restart=on-failure
RestartSec=2

# Re-heal the home screen whenever the compositor becomes ready, regardless of
# WHY it (re)started -- boot, socket-activation, watchdog or crash-restart.
# `try-restart` is a no-op if the home screen is not running yet (first boot),
# and restarts it if it is -- reconnecting it to the fresh compositor and
# re-establishing the agl-shell background role. PartOf= only covers explicit
# `systemctl restart agl-compositor`; this covers the crash/socket path it misses.
#   '+' runs with full privileges -- the service runs as User=agl-driver, which
#       cannot manage system units.
#   '-' ignores failures so a heal hiccup never blocks the compositor coming up.
ExecStartPost=+-/usr/bin/systemctl --no-block try-restart flutter-ics-homescreen.service
