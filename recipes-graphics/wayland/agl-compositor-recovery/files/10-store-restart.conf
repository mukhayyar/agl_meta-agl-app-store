# Auto-restart the App Store instance if it ever dies (crash resilience).
# Scoped to the agl_app_store instance only (NOT the agl-app-flutter@ template)
# so other apps still close normally. The store's own close button (exitApp does
# `systemctl stop`) is an explicit stop and does NOT count as a failure, so it
# will not trigger a restart -- the close button keeps working.
[Unit]
# Never latch into a failed state: an appliance must come back by itself.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=3
