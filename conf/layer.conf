# ============================================================
# meta-agl-app-store — Yocto layer for AGL PENS App Store
# ============================================================
# Provides:
#   1. The AGL App Store Flutter application recipe
#   2. Flatpak runtime packagegroup for AGL
#   3. Pre-configured PENSHub + Flathub remote repositories
#   4. Distro include for enabling Flatpak in AGL images
#
# Target release: AGL `trout` (Yocto 5.0 scarthgap / poky 5.0.15)
# ============================================================

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-agl-app-store"
BBFILE_PATTERN_meta-agl-app-store = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-agl-app-store = "6"

# Layer dependencies:
#   core                — OE-Core base
#   openembedded-layer  — meta-oe: flatpak 1.15.8, ostree 2024.5, gnupg
#   flutter-layer       — meta-flutter: flutter embedder + flutter-app class
#   agldemo             — meta-agl-demo: bbappend on packagegroup-agl-demo-platform-flutter
#   meta-app-framework  — AGL application framework (agl-app class, applaunchd)
#
# Note: Flatpak and OSTree base recipes come from meta-oe. This layer does
# NOT bundle its own flatpak_git.bb or ostree_git.bb — it only provides a
# packagegroup and a predefined-repos recipe on top.
LAYERDEPENDS_meta-agl-app-store = "core openembedded-layer flutter-layer agldemo meta-app-framework"

LAYERSERIES_COMPAT_meta-agl-app-store = "scarthgap"

# ── Flatpak configuration variables ──────────────────────────
FLATPAK_SYSTEM_DIR ?= "/var/lib/flatpak"
FLATPAK_GPGDIR     ?= "${TOPDIR}/gpg"
FLATPAK_GPGID      ?= "pens-agl-store-signing@key"
FLATPAK_PENSHUB_URL ?= "https://repo.agl-store.cyou"
FLATPAK_FLATHUB_URL ?= "https://dl.flathub.org/repo"
